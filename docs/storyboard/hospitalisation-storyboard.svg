<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Storyboard for the Beyond the Crash hospitalised injury data story</title>
  <desc id="description">Seven connected panels show the website narrative from the opening question through national trends, road users, age and sex, states, First Nations comparisons, and methods.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#d19a13"/>
    </marker>
    <style>
      .bg{fill:#f5f1e8}.ink{fill:#13262f}.muted{fill:#48616b}.teal{fill:#075a67}.orange{fill:#b84a14}.gold{fill:#d19a13}.blue{fill:#2d57a1}.white{fill:#fffdf8}
      .panel{fill:#fffdf8;stroke:#cad2cf;stroke-width:2}.panel-title{font:700 24px Arial,sans-serif;fill:#13262f}.step{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#b84a14}
      .body{font:17px Arial,sans-serif;fill:#48616b}.small{font:14px Arial,sans-serif;fill:#48616b}.label{font:700 14px Arial,sans-serif;fill:#13262f}
      .mini{fill:#edf2ef;stroke:#cad2cf;stroke-width:1.5}.axis{stroke:#7f918f;stroke-width:1.5}.grid{stroke:#dfe5e2;stroke-width:1}.flow{fill:none;stroke:#d19a13;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <rect x="0" y="0" width="1600" height="14" class="gold"/>
  <text x="70" y="72" font-family="Georgia,serif" font-size="42" font-weight="700" class="ink">Beyond the crash — website storyboard</text>
  <text x="70" y="108" font-family="Arial,sans-serif" font-size="19" class="muted">Audience journey: understand the scale, identify patterns, compare groups carefully, then inspect the evidence.</text>
  <rect x="1280" y="49" width="250" height="58" rx="29" class="teal"/>
  <text x="1405" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fffdf8">AUSTRALIA · 2011–2021</text>
  <text x="1405" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#dcecea">BITRE hospitalised injuries</text>

  <!-- Row 1 -->
  <g transform="translate(70 155)">
    <rect class="panel" width="440" height="245" rx="18"/>
    <text x="28" y="37" class="step">01 · OPENING</text>
    <text x="28" y="73" class="panel-title">Road trauma continues</text>
    <text x="28" y="102" class="panel-title">beyond fatalities</text>
    <rect x="28" y="125" width="170" height="6" class="gold"/>
    <text x="28" y="159" class="body">Set the question: who enters hospital</text>
    <text x="28" y="183" class="body">after road crashes, and how has the</text>
    <text x="28" y="207" class="body">burden changed?</text>
    <rect x="270" y="126" width="138" height="88" rx="10" fill="#f8eadf"/>
    <text x="339" y="151" text-anchor="middle" class="label">READ COUNTS</text>
    <text x="339" y="173" text-anchor="middle" class="small">Counts show burden,</text>
    <text x="339" y="194" text-anchor="middle" class="small">not personal risk.</text>
  </g>

  <path class="flow" d="M520 278 H555"/>

  <g transform="translate(570 155)">
    <rect class="panel" width="440" height="245" rx="18"/>
    <text x="28" y="37" class="step">02 · NATIONAL TREND</text>
    <text x="28" y="73" class="panel-title">How did the burden change?</text>
    <rect x="28" y="94" width="384" height="117" rx="10" class="mini"/>
    <line x1="55" y1="185" x2="385" y2="185" class="axis"/>
    <line x1="55" y1="112" x2="55" y2="185" class="axis"/>
    <path d="M55 170 C95 162 115 167 150 150 S220 151 255 130 S320 140 385 103" fill="none" stroke="#075a67" stroke-width="5"/>
    <circle cx="55" cy="170" r="5" class="orange"/><circle cx="385" cy="103" r="5" class="orange"/>
    <text x="28" y="232" class="small">Interaction: choose hospitalisations or bed days;</text>
    <text x="28" y="251" class="small">adjust the year range and inspect exact values.</text>
  </g>

  <path class="flow" d="M1020 278 H1055"/>

  <g transform="translate(1070 155)">
    <rect class="panel" width="460" height="245" rx="18"/>
    <text x="28" y="37" class="step">03 · ROAD USERS</text>
    <text x="28" y="73" class="panel-title">Who records the largest totals?</text>
    <rect x="28" y="94" width="404" height="118" rx="10" class="mini"/>
    <line x1="145" y1="111" x2="145" y2="196" class="axis"/>
    <text x="137" y="129" text-anchor="end" class="small">Car driver</text><line x1="145" y1="124" x2="385" y2="124" stroke="#2d57a1" stroke-width="5"/><circle cx="385" cy="124" r="8" class="blue"/>
    <text x="137" y="161" text-anchor="end" class="small">Motorcyclist</text><line x1="145" y1="156" x2="315" y2="156" stroke="#2d57a1" stroke-width="5"/><circle cx="315" cy="156" r="8" class="blue"/>
    <text x="137" y="193" text-anchor="end" class="small">Pedal cyclist</text><line x1="145" y1="188" x2="275" y2="188" stroke="#2d57a1" stroke-width="5"/><circle cx="275" cy="188" r="8" class="blue"/>
    <text x="28" y="235" class="small">Interaction: switch between the top six categories</text>
    <text x="28" y="254" class="small">and all road-user categories.</text>
  </g>

  <!-- Row transition -->
  <path class="flow" d="M1300 410 V438 H300 V466"/>

  <!-- Row 2 -->
  <g transform="translate(70 480)">
    <rect class="panel" width="440" height="260" rx="18"/>
    <text x="28" y="37" class="step">04 · AGE AND SEX</text>
    <text x="28" y="73" class="panel-title">Which age groups carry the burden?</text>
    <rect x="28" y="94" width="384" height="126" rx="10" class="mini"/>
    <line x1="56" y1="196" x2="392" y2="196" class="axis"/>
    <rect x="78" y="169" width="16" height="27" class="blue"/><rect x="97" y="174" width="16" height="22" class="orange"/>
    <rect x="142" y="137" width="16" height="59" class="blue"/><rect x="161" y="149" width="16" height="47" class="orange"/>
    <rect x="206" y="113" width="16" height="83" class="blue"/><rect x="225" y="130" width="16" height="66" class="orange"/>
    <rect x="270" y="105" width="16" height="91" class="blue"/><rect x="289" y="126" width="16" height="70" class="orange"/>
    <rect x="334" y="143" width="16" height="53" class="blue"/><rect x="353" y="152" width="16" height="44" class="orange"/>
    <text x="28" y="244" class="small">Grouped bars compare categories without implying</text>
    <text x="28" y="264" class="small">that a larger count means a higher individual risk.</text>
  </g>

  <path class="flow" d="M520 610 H555"/>

  <g transform="translate(570 480)">
    <rect class="panel" width="440" height="260" rx="18"/>
    <text x="28" y="37" class="step">05 · STATES AND TIME</text>
    <text x="28" y="73" class="panel-title">Where and when are counts highest?</text>
    <rect x="28" y="94" width="384" height="126" rx="10" class="mini"/>
    <g transform="translate(60 108)">
      <text x="0" y="18" class="small">NSW</text><text x="0" y="44" class="small">Vic</text><text x="0" y="70" class="small">Qld</text><text x="0" y="96" class="small">WA</text>
      <g transform="translate(45 0)">
        <rect width="48" height="22" fill="#dbe8e5"/><rect x="52" width="48" height="22" fill="#9ec7c3"/><rect x="104" width="48" height="22" fill="#4d9895"/><rect x="156" width="48" height="22" fill="#075a67"/><rect x="208" width="48" height="22" fill="#2f7b7b"/>
        <rect y="26" width="48" height="22" fill="#e7efed"/><rect x="52" y="26" width="48" height="22" fill="#b7d5d1"/><rect x="104" y="26" width="48" height="22" fill="#75aaa7"/><rect x="156" y="26" width="48" height="22" fill="#2f7b7b"/><rect x="208" y="26" width="48" height="22" fill="#5b9e9b"/>
        <rect y="52" width="48" height="22" fill="#edf2ef"/><rect x="52" y="52" width="48" height="22" fill="#dbe8e5"/><rect x="104" y="52" width="48" height="22" fill="#b7d5d1"/><rect x="156" y="52" width="48" height="22" fill="#75aaa7"/><rect x="208" y="52" width="48" height="22" fill="#9ec7c3"/>
        <rect y="78" width="48" height="22" fill="#edf2ef"/><rect x="52" y="78" width="48" height="22" fill="#e7efed"/><rect x="104" y="78" width="48" height="22" fill="#dbe8e5"/><rect x="156" y="78" width="48" height="22" fill="#b7d5d1"/><rect x="208" y="78" width="48" height="22" fill="#dbe8e5"/>
      </g>
    </g>
    <text x="28" y="244" class="small">Heatmap supports scanning across years and places.</text>
    <text x="28" y="264" class="small">Caveat: totals are affected by population size.</text>
  </g>

  <path class="flow" d="M1020 610 H1055"/>

  <g transform="translate(1070 480)">
    <rect class="panel" width="460" height="260" rx="18"/>
    <text x="28" y="37" class="step">06 · FIRST NATIONS</text>
    <text x="28" y="73" class="panel-title">How do age profiles differ?</text>
    <rect x="28" y="94" width="404" height="126" rx="10" class="mini"/>
    <line x1="58" y1="196" x2="406" y2="196" class="axis"/>
    <path d="M70 174 L128 158 L186 132 L244 120 L302 138 L360 165" fill="none" stroke="#b84a14" stroke-width="4"/>
    <path d="M70 184 L128 168 L186 148 L244 132 L302 105 L360 140" fill="none" stroke="#2d57a1" stroke-width="4"/>
    <circle cx="244" cy="120" r="5" class="orange"/><circle cx="302" cy="105" r="5" class="blue"/>
    <text x="28" y="244" class="small">Interaction: compare within-group age shares or</text>
    <text x="28" y="264" class="small">absolute counts. Neither view is a population rate.</text>
  </g>

  <path class="flow" d="M1300 750 V778 H800 V806"/>

  <!-- Closing panel -->
  <g transform="translate(270 820)">
    <rect class="panel" width="1060" height="210" rx="18"/>
    <text x="30" y="40" class="step">07 · METHODS, ACCESSIBILITY AND TAKEAWAY</text>
    <text x="30" y="78" class="panel-title">End with evidence—not a claim the data cannot support</text>
    <g transform="translate(30 104)">
      <rect width="300" height="72" rx="10" fill="#e5f0ee"/>
      <text x="18" y="26" class="label">SOURCE</text><text x="18" y="50" class="small">BITRE / AIHW, 2011–2021</text>
    </g>
    <g transform="translate(350 104)">
      <rect width="300" height="72" rx="10" fill="#f8eadf"/>
      <text x="18" y="26" class="label">LIMITATIONS</text><text x="18" y="50" class="small">Counts, missing “n.p.”, no rates</text>
    </g>
    <g transform="translate(670 104)">
      <rect width="330" height="72" rx="10" fill="#e8edf7"/>
      <text x="18" y="26" class="label">ACCESS</text><text x="18" y="50" class="small">Tooltips, keyboard use and data tables</text>
    </g>
  </g>

  <text x="70" y="1080" class="small">Storyboard purpose: guide the audience from a broad national question to focused comparisons, while repeating the distinction between burden (counts) and risk (rates).</text>
  <text x="1530" y="1080" text-anchor="end" class="small">Group 28 · Hospitalised injury visualisation</text>
</svg>
